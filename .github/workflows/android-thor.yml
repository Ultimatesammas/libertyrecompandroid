name: Build Thor test APK

on:
  push:
    branches: [thor-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-thor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: thor-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/run_thor_checks.py

  apk:
    needs: controller-tests
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: thor-build
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install build tools
        run: python -m pip install 'cmake>=3.29,<4' ninja
      - name: Initialize pinned public dependencies
        run: python tools/setup_repo.py --jobs 4
      - name: Build renderer and package verified baseline/test APKs
        run: bash os/android/scripts/build_thor_cloud.sh
      - name: Upload signed APKs and validation record
        uses: actions/upload-artifact@v4
        with:
          name: LibertyRecomp-Thor-test-${{ github.run_number }}
          path: out/thor-apks/
          if-no-files-found: error
          retention-days: 14
